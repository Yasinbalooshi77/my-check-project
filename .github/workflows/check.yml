name: Shopify Modern Theme Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  shopify-theme-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Shopify theme
        shell: bash
        run: |
          mkdir -p extracted-theme
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d extracted-theme

          THEME_DIR=$(find extracted-theme -type d -name assets -printf '%h\n' | head -n 1)

          if [ -z "$THEME_DIR" ]; then
            echo "Could not locate Shopify theme"
            exit 1
          fi

          echo "THEME_DIR=$THEME_DIR" >> "$GITHUB_ENV"
          echo "Theme found at: $THEME_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install latest Shopify CLI and Theme tools
        run: |
          npm install -g @shopify/cli@latest @shopify/theme@latest
          shopify version
          shopify theme check --version

      - name: Run modern Shopify Theme Check
        id: themecheck
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          shopify theme check \
            --path "$THEME_DIR" \
            --fail-level error \
            --no-color 2>&1 | tee theme-check-report.txt

      - name: Add report to GitHub summary
        if: always()
        run: |
          echo "# Shopify Theme Check Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 200 theme-check-report.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopify-theme-check-report
          path: theme-check-report.txt

      - name: Fail if real Theme Check errors exist
        if: steps.themecheck.outcome == 'failure'
        run: exit 1
