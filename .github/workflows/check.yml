name: Shopify Full Comprehensive Audit

on: [push]

jobs:
  shopify-performance-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Files
      uses: actions/checkout@v4

    - name: Extract Shopify Theme Files
      run: unzip *.zip -d my_extracted_files

    # تثبيت أداة شوبيفاي الرسمية لفحص الأخطاء والسرعة
    - name: Install Shopify Theme Check Tool
      run: |
        sudo gem install theme-check

    # تشغيل الفحص الشامل ليعطيك التقرير
    - name: Execute Speed & Bug Diagnostics
      run: |
        cd my_extracted_files
        theme-check .
