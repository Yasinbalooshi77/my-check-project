name: GitHub AI Full Auto-Fix

on: [push]

jobs:
  shopify-ai-fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Checkout Repository Files
      uses: actions/checkout@v4

    - name: Extract Shopify Theme Files
      run: unzip *.zip -d my_extracted_files

    # 1. تشغيل أداة شوبيفاي لإصلاح وسوم Liquid تلقائياً لزيادة السرعة
    - name: Run Shopify AI Auto-Fix
      run: |
        sudo gem install theme-check
        cd my_extracted_files
        theme-check --auto-correct . || true

    # 2. إعادة ضغط الملفات بعد تسريعها وحفظها بأمان
    - name: Zip Optimized Theme
      run: |
        cd my_extracted_files
        zip -r ../VALESCO-V8-OPTIMIZED.zip .

    # 3. رفع ملف القالب السريع والجديد بداخل حسابك مجاناً
    - name: Upload Speedy Theme File
      uses: actions/upload-artifact@v4
      with:
        name: Shopify-Speedy-Theme
        path: VALESCO-V8-OPTIMIZED.zip
