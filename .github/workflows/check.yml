name: Shopify Full Comprehensive Audit

on: [push]

jobs:
  shopify-performance-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Files
      uses: actions/checkout@v4

    - name: Extract Shopify Theme Files
      run: unzip *.zip -d my_extracted_files

    # تثبيت أداة شوبيفاي الرسمية للفحص
    - name: Install Shopify Theme Check Tool
      run: |
        sudo gem install theme-check

    # تشغيل الفحص وحفظ النتيجة داخل ملف نصي مخصص للتحميل
    - name: Execute Diagnostics and Save Report
      run: |
        cd my_extracted_files
        theme-check . > ../shopify_audit_report.txt
      continue-on-error: true

    # أمر إجباري لجعل GitHub يرفع الملف بصفحة التشغيل للتحميل
    - name: Downloadable Report File
      uses: actions/upload-artifact@v4
      with:
        name: Shopify-Comprehensive-Report
        path: shopify_audit_report.txt
